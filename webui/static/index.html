<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPRD - 多模态双语PRD生成系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            color: #666;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: #667eea;
            font-weight: bold;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .status-message.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-message.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .prd-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .prd-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .prd-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .prd-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .prd-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .prd-card .actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-card .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .metric-card .metric-label {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AMPRD</h1>
            <p>多模态双语PRD自动生成系统</p>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('generate')">生成PRD</button>
                <button class="tab" onclick="switchTab('list')">PRD列表</button>
                <button class="tab" onclick="switchTab('tasks')">任务状态</button>
            </div>

            <!-- 生成PRD标签页 -->
            <div id="tab-generate" class="tab-content active">
                <h2>生成新的PRD</h2>
                <form id="generate-form" onsubmit="generatePRD(event)">
                    <div class="form-group">
                        <label for="input-type">输入方式</label>
                        <select id="input-type" onchange="toggleInputType()">
                            <option value="text">自然语言描述</option>
                            <option value="json">结构化Brief JSON</option>
                        </select>
                    </div>

                    <div id="input-text-container" class="form-group">
                        <label for="brief-text">产品需求描述</label>
                        <textarea id="brief-text" placeholder="例如：我们要做一个智能客服系统，目标是提升客户服务效率和用户体验..."></textarea>
                    </div>

                    <div id="input-json-container" class="form-group hidden">
                        <label for="brief-json">Brief JSON</label>
                        <textarea id="brief-json" placeholder='{"title": "产品名称", "domain": "领域", "goal": "目标描述", ...}'></textarea>
                    </div>

                    <div class="form-group">
                        <label for="template-id">模板ID（可选）</label>
                        <input type="text" id="template-id" placeholder="留空使用默认模板">
                    </div>

                    <button type="submit" class="btn btn-primary" id="generate-btn">
                        开始生成PRD
                    </button>
                </form>

                <div id="progress-container" class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill">0%</div>
                    </div>
                    <div class="status-message info" id="status-message">等待开始...</div>
                </div>
            </div>

            <!-- PRD列表标签页 -->
            <div id="tab-list" class="tab-content">
                <h2>已生成的PRD</h2>
                <button class="btn btn-primary" onclick="loadPRDList()">刷新列表</button>
                <div id="prd-list" class="prd-list">
                    <p>加载中...</p>
                </div>
            </div>

            <!-- 任务状态标签页 -->
            <div id="tab-tasks" class="tab-content">
                <h2>任务状态</h2>
                <div class="form-group">
                    <label for="task-id">任务ID</label>
                    <input type="text" id="task-id" placeholder="输入任务ID查询状态">
                    <button class="btn btn-primary" onclick="checkTaskStatus()" style="margin-top: 10px;">查询状态</button>
                </div>
                <div id="task-status"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Tab切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'list') {
                loadPRDList();
            }
        }

        // 切换输入类型
        function toggleInputType() {
            const inputType = document.getElementById('input-type').value;
            const textContainer = document.getElementById('input-text-container');
            const jsonContainer = document.getElementById('input-json-container');
            
            if (inputType === 'text') {
                textContainer.classList.remove('hidden');
                jsonContainer.classList.add('hidden');
            } else {
                textContainer.classList.add('hidden');
                jsonContainer.classList.remove('hidden');
            }
        }

        // 生成PRD
        async function generatePRD(event) {
            event.preventDefault();
            
            const inputType = document.getElementById('input-type').value;
            const templateId = document.getElementById('template-id').value || null;
            const generateBtn = document.getElementById('generate-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const statusMessage = document.getElementById('status-message');
            
            // 准备请求数据
            let requestData = {};
            if (inputType === 'text') {
                const briefText = document.getElementById('brief-text').value.trim();
                if (!briefText) {
                    alert('请输入产品需求描述');
                    return;
                }
                requestData.brief_text = briefText;
            } else {
                const briefJson = document.getElementById('brief-json').value.trim();
                if (!briefJson) {
                    alert('请输入Brief JSON');
                    return;
                }
                try {
                    requestData.brief = JSON.parse(briefJson);
                } catch (e) {
                    alert('Brief JSON格式错误：' + e.message);
                    return;
                }
            }
            
            if (templateId) {
                requestData.template_id = templateId;
            }
            
            // 禁用按钮
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading"></span>正在启动...';
            
            try {
                // 发送生成请求
                const response = await fetch(`${API_BASE}/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                if (!response.ok) {
                    throw new Error('生成请求失败');
                }
                
                const result = await response.json();
                const taskId = result.task_id;
                
                // 显示进度容器
                progressContainer.classList.add('active');
                statusMessage.className = 'status-message info';
                statusMessage.textContent = `任务已启动，任务ID: ${taskId}`;
                
                // 轮询任务状态
                pollTaskStatus(taskId, progressFill, statusMessage, generateBtn);
                
            } catch (error) {
                alert('生成失败：' + error.message);
                generateBtn.disabled = false;
                generateBtn.innerHTML = '开始生成PRD';
            }
        }

        // 轮询任务状态
        async function pollTaskStatus(taskId, progressFill, statusMessage, generateBtn) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/status/${taskId}`);
                    if (!response.ok) {
                        throw new Error('查询状态失败');
                    }
                    
                    const status = await response.json();
                    
                    // 更新进度
                    progressFill.style.width = `${status.progress}%`;
                    progressFill.textContent = `${Math.round(status.progress)}%`;
                    
                    // 更新状态消息
                    statusMessage.textContent = status.current_step || status.status;
                    
                    if (status.status === 'completed') {
                        clearInterval(interval);
                        statusMessage.className = 'status-message success';
                        statusMessage.textContent = `✅ 生成完成！PRD路径: ${status.prd_path}`;
                        generateBtn.disabled = false;
                        generateBtn.innerHTML = '开始生成PRD';
                        
                        // 显示下载链接
                        const downloadLinks = `
                            <div style="margin-top: 15px;">
                                <a href="${API_BASE}/api/download/${taskId}?format=json" class="btn btn-small btn-secondary" download>下载JSON</a>
                                <a href="${API_BASE}/api/download/${taskId}?format=docx" class="btn btn-small btn-secondary" download>下载DOCX</a>
                                <a href="${API_BASE}/api/download/${taskId}?format=markdown" class="btn btn-small btn-secondary" download>下载Markdown</a>
                            </div>
                        `;
                        statusMessage.innerHTML += downloadLinks;
                        
                    } else if (status.status === 'failed') {
                        clearInterval(interval);
                        statusMessage.className = 'status-message error';
                        statusMessage.textContent = `❌ 生成失败：${status.error}`;
                        generateBtn.disabled = false;
                        generateBtn.innerHTML = '开始生成PRD';
                    }
                    
                } catch (error) {
                    console.error('查询状态失败：', error);
                }
            }, 2000); // 每2秒查询一次
        }

        // 加载PRD列表
        async function loadPRDList() {
            const prdList = document.getElementById('prd-list');
            prdList.innerHTML = '<p>加载中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/prds?limit=50`);
                if (!response.ok) {
                    throw new Error('加载列表失败');
                }
                
                const data = await response.json();
                
                if (data.prds.length === 0) {
                    prdList.innerHTML = '<p>暂无PRD</p>';
                    return;
                }
                
                prdList.innerHTML = data.prds.map(prd => `
                    <div class="prd-card">
                        <h3>${prd.title || prd.prd_id}</h3>
                        <p>创建时间: ${new Date(prd.created_at).toLocaleString()}</p>
                        <p>文件大小: ${(prd.file_size / 1024).toFixed(2)} KB</p>
                        <div class="actions">
                            <a href="${API_BASE}/api/download/${prd.prd_id}?format=json" class="btn btn-small btn-secondary" download>JSON</a>
                            <a href="${API_BASE}/api/download/${prd.prd_id}?format=docx" class="btn btn-small btn-secondary" download>DOCX</a>
                            <button class="btn btn-small btn-primary" onclick="viewPRD('${prd.prd_id}')">查看</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                prdList.innerHTML = `<p class="status-message error">加载失败：${error.message}</p>`;
            }
        }

        // 查看PRD
        async function viewPRD(prdId) {
            try {
                const response = await fetch(`${API_BASE}/api/prd/${prdId}`);
                if (!response.ok) {
                    throw new Error('加载PRD失败');
                }
                
                const prd = await response.json();
                alert(`PRD内容预览：\n${JSON.stringify(prd, null, 2).substring(0, 500)}...`);
                
            } catch (error) {
                alert('查看PRD失败：' + error.message);
            }
        }

        // 查询任务状态
        async function checkTaskStatus() {
            const taskId = document.getElementById('task-id').value.trim();
            const taskStatusDiv = document.getElementById('task-status');
            
            if (!taskId) {
                alert('请输入任务ID');
                return;
            }
            
            taskStatusDiv.innerHTML = '<p>查询中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/status/${taskId}`);
                if (!response.ok) {
                    throw new Error('查询失败');
                }
                
                const status = await response.json();
                
                taskStatusDiv.innerHTML = `
                    <div class="status-message ${status.status === 'completed' ? 'success' : status.status === 'failed' ? 'error' : 'info'}">
                        <h3>任务状态: ${status.status}</h3>
                        <p>进度: ${status.progress}%</p>
                        <p>当前步骤: ${status.current_step || 'N/A'}</p>
                        ${status.error ? `<p>错误: ${status.error}</p>` : ''}
                        ${status.prd_path ? `<p>PRD路径: ${status.prd_path}</p>` : ''}
                        ${status.status === 'completed' ? `
                            <div style="margin-top: 15px;">
                                <a href="${API_BASE}/api/download/${taskId}?format=json" class="btn btn-small btn-secondary" download>下载JSON</a>
                                <a href="${API_BASE}/api/download/${taskId}?format=docx" class="btn btn-small btn-secondary" download>下载DOCX</a>
                            </div>
                        ` : ''}
                    </div>
                `;
                
            } catch (error) {
                taskStatusDiv.innerHTML = `<p class="status-message error">查询失败：${error.message}</p>`;
            }
        }

        // 页面加载时自动加载PRD列表
        window.addEventListener('load', () => {
            loadPRDList();
        });
    </script>
</body>
</html>
